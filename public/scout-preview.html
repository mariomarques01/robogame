<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SCOUT-X | Modelo 3D</title>
<style>html,body{margin:0;height:100%;background:#07101f;color:white;font-family:system-ui}#view{width:100%;height:calc(100dvh - 154px);touch-action:none}header{padding:12px 16px}a{color:#67e8f9}small{color:#9ca3af}canvas{display:block}button{background:#163e6b;border:1px solid #46c8ff;border-radius:8px;padding:10px;color:white;font-weight:bold}button:disabled{opacity:.5}#controls{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap}#status{padding:5px 16px;font-size:12px;color:#9ca3af}</style></head>
<body><header><a href="./">← Voltar ao ROBO ARENA</a><div><b>SCOUT-X — Arquivo GLB do jogo</b></div><small>Arraste para girar • Pinça para zoom</small></header>
<div id="view"></div><div id="controls"><button data-action="Walk">Caminhar</button><button data-action="Attack">Atacar</button><button data-action="stop">Parar</button><a href="./models/scout_x.glb" download="scout_x.glb">Baixar GLB</a></div><div id="status">Carregando modelo 3D...</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import {OrbitControls} from 'https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const view=document.getElementById('view'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color('#07101f');
const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(2.4,1.9,3.2);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.7,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xcceeff,0x17233d,2.4));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(2,5,4);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,.04,48),new THREE.MeshStandardMaterial({color:'#13243a',metalness:.6,roughness:.4}));floor.position.y=-.04;scene.add(floor);
let mixer=null,clips={};const clock=new THREE.Clock();
new GLTFLoader().load('./models/scout_x.glb',gltf=>{
 scene.add(gltf.scene);mixer=new THREE.AnimationMixer(gltf.scene);
 for(const clip of gltf.animations)clips[clip.name]=mixer.clipAction(clip);
 status.textContent='Modelo GLB carregado — animações: '+(Object.keys(clips).join(', ')||'nenhuma');
 clips.Walk?.play();
},undefined,error=>{status.textContent='Erro ao carregar GLB: '+error.message;console.error(error)});
document.querySelectorAll('button[data-action]').forEach(button=>button.addEventListener('click',()=>{
 if(!mixer)return;
 mixer.stopAllAction();const action=clips[button.dataset.action];if(action){action.reset().play();}
}));
function resize(){const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);controls.update();renderer.render(scene,camera)}loop();
</script></body></html>
