<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBO ARENA 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#071522;color:#fff;font:13px system-ui}main{height:100vh;height:100dvh;max-width:600px;margin:auto;display:flex;flex-direction:column}header{padding:7px;background:#102c47;display:flex;justify-content:space-between;font-weight:900;color:#ffce5c}#stage{flex:1 1 auto;min-height:200px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;text-shadow:0 2px 4px black;pointer-events:none}.deck{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0b2139;padding:6px}.card{background:linear-gradient(#3b5b77,#10253a);color:white;border:1px solid #7a9cba;border-radius:8px;padding:4px 0;font-size:10px;min-width:0}.card.ready{border:2px solid #4ce1ff;box-shadow:0 0 9px #00bbff}.card:disabled{opacity:.45}.card svg{width:100%;height:48px}#msg{padding:6px;background:#18344c}footer{padding:5px 10px;background:#0d2239;display:flex;justify-content:space-between}#reset{background:#ffcf5b;border:0;border-radius:5px;font-weight:800}#error{display:none;position:absolute;inset:0;background:#142b3c;padding:25px;z-index:10;overflow:auto}</style></head><body><main><header>⚙ ROBO ARENA <span>3D · TESTE 0.4.4</span></header><div id="stage"><canvas id="game"></canvas><div id="hud"><span id="eh">🔴 3000</span><span id="time">03:00</span><span id="ah">🔵 3000</span></div><div id="error">O motor 3D não carregou. Verifique a conexão e recarregue.</div></div><div id="deck" class="deck"></div><div id="msg">Toque na carta SCOUT para invocar.</div><footer><span>⚡ Conquiste estações para liberar robôs</span><button id="reset">Reiniciar</button></footer></main><script>

&next===i?'INVOCAR':'🔒')+'</small>';b.onclick=()=>spawn(0);deck.appendChild(b)})}function spawn(team){if(ended||units.filter(u=>u.team===team).length>=5||!(team?enemyReady:ready))return;let i=team?enemyNext:next,u=makeRobot(team,i,(Math.random()-.5)*2,team?-8:8);units.push(u);if(team){enemyReady=false}else{ready=false;selected=u;say(specs[i][0]+' invocado. Toque em uma estação para comandar.');cards()}}function unlock(team){if(team){if(!enemyReady){enemyNext=(enemyNext+1)%5;enemyReady=true}}else if(!ready){next=(next+1)%5;ready=true;say('⚡ Próximo robô liberado: '+specs[next][0]);cards()}}function shoot(u,target,heal=false){let p=B.MeshBuilder.CreateSphere('laser',{diameter:.2,segments:8},scene);p.material=heal?M.green:u.team?M.red:M.blue;let a=u.root.position.add(new B.Vector3(0,1.3,0)),b=target.root.position.add(new B.Vector3(0,1,0));p.position.copyFrom(a);shots.push({p,a,b,t:0})}function update(dt){if(ended)return;clock=Math.max(0,clock-dt);enemyTimer-=dt;if(enemyTimer<=0){if(enemyReady)spawn(1);enemyTimer=3}for(let s of stations){s.cd=Math.max(0,s.cd-dt);s.core.material=s.cd?M.off:M.blue;if(s.cd)continue;let near=units.filter(u=>Math.hypot(u.x-s.x,u.z-s.z)<1.2),blue=near.some(u=>!u.team),red=near.some(u=>u.team);if(blue!==red){let owner=blue?0:1;s.progress=s.owner===owner?s.progress+dt:dt;s.owner=owner;if(s.progress>=1){s.cd=12;s.progress=0;unlock(owner)}}else{s.progress=0;s.owner=-1}}for(let u of units){u.cool=Math.max(0,u.cool-dt);let target=null,d=999;for(let v of units)if(v.team!==u.team){let q=Math.hypot(u.x-v.x,u.z-v.z);if(q<d){d=q;target=v}}if(target&&d<specs[u.i][4]){if(!u.cool){target.hp-=specs[u.i][2];shoot(u,target);if(u.i===3)for(let a of units.filter(a=>a.team===u.team&&Math.hypot(a.x-u.x,a.z-u.z)<2.5))a.hp=Math.min(a.max,a.hp+25);u.cool=.85}continue}let enemy=towers[1-u.team],distance=Math.hypot(u.x,u.z-enemy.root.position.z);if(distance<2.5){if(!u.cool){enemy.hp-=specs[u.i][2];shoot(u,enemy);u.cool=1}continue}if(u.team){let targets=stations.filter .5,Math.min(5.5,pos.x));selected.tz=Math.max(-10,Math.min(10,pos.z));say(specs[selected.i][0]+' seguindo para o destino.');selected=null}});function reset(){for(let u of units)u.root.dispose(false,true);for(let s of shots)s.p.dispose();units=[];shots=[];for(let s of stations){s.cd=0;s.progress=0;s.owner=-1}for(let t of towers)t.hp=3000;next=0;ready=true;enemyNext=0;enemyReady=true;enemyTimer=3;clock=180;ended=false;selected=null;say('Toque na carta SCOUT para invocar.');cards()}document.querySelector('#reset').onclick=reset;resize();cards();window.__roboBoot='running';engine.runRenderLoop(()=>{let now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;update(dt);scene.render()})}catch(e){showError(e)}}function load3D(urls){let url=urls.shift();if(!url){document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='Não foi possível carregar o motor 3D. Verifique a conexão ou tente abrir no Chrome.';return}let script=document.createElement('script');script.src=url;script.onload=()=>{if(window.BABYLON)startRobo();else load3D(urls)};script.onerror=()=>{window.__roboError='Falha ao baixar biblioteca de '+url;load3D(urls)};document.head.appendChild(script)}load3D(['https://cdn.babylonjs.com/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js','https://unpkg.com/babylonjs@7.54.3/babylon.js']);</script><script>
(function(){

 function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#071725';ctx.fillRect(0,0,w,h);let bw=Math.min(w-16,h*.57),bh=Math.min(h-16,bw*2.05),ox=(w-bw)/2,oy=(h-bh)/2;function p(x,y){return [ox+(x+1)*bw/2,oy+(y+1)*bh/2]}ctx.fillStyle='#1b3445';ctx.fillRect(ox,oy,bw,bh);for(let i=0;i<13;i++)for(let j=0;j<25;j++){ctx.fillStyle=(i+j)%2?'#344e60':'#3b586a';ctx.fillRect(ox+i*bw/13+1,oy+j*bh/25+1,bw/13-2,bh/25-2)}ctx.fillStyle='#036eae';ctx.fillRect(ox,oy+bh*.46,bw,bh*.08);ctx.fillStyle='#9aa9b3';for(let x of [.25,.75])ctx.fillRect(ox+bw*x-20,oy+bh*.45,40,bh*.1);for(let [i,y,c] of [[0,-.84,'#f04b55'],[1,.84,'#19baf8']]){let [x0,y0]=p(0,y);ctx.fillStyle='#152737';ctx.fillRect(x0-35,y0-25,70,50);ctx.fillStyle=c;ctx.fillRect(x0-22,y0-18,44,30);ctx.fillStyle='#c7d5df';ctx.fillRect(x0-12,y0-31,24,15)}for(let s of pads){let [x,y]=p(s.x,s.y);ctx.beginPath();ctx.arc(x,y,Math.max(11,bw*.065),0,7);ctx.fillStyle=s.cd>0?'#6e747b':'#ffc338';ctx.fill();ctx.beginPath();ctx.arc(x,y,Math.max(5,bw*.032),0,7);ctx.fillStyle=s.cd>0?'#444e5a':'#26d5ff';ctx.fill()}for(let u of robots){let [x,y]=p(u.x,u.y);ctx.fillStyle=u.team?'#ff5966':colors[u.i];ctx.strokeStyle='#102331';ctx.lineWidth=3;ctx.fillRect(x-10,y-11,20,24);ctx.strokeRect(x-10,y-11,20,24);ctx.fillStyle='#c9f8ff';ctx.fillRect(x-7,y-6,14,5)}ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('🔴 '+Math.max(0,Math.ceil(enemy)),ox+6,oy+17);ctx.fillText('🔵 '+Math.max(0,Math.ceil(ally)),ox+6,oy+bh-8)}
